allowBuilds:
  sharp: false
  unrs-resolver: false

# Security patch for ESLint's transitive YAML parser.
overrides:
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Patch brace-expansion DoS advisories in both transitive major versions.
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
