allowBuilds:
  sharp: false
  unrs-resolver: false

# Security patches for transitive dependencies.
overrides:
  # CVE-2023-54404: check collection size bounds before parsing elements.
  'zod@>=4.0.0 <4.6.6': 4.6.6
  # GHSA-wq5f-xc86-pv6w: patched librsvg in sharp's prebuilt binaries.
  'sharp@<0.35.5': 0.35.5
  # CVE-2026-93749: validate indexed source-map offsets.
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  # Patch brace-expansion DoS advisories in both transitive major versions.
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
